<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPA QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f5f2f8;color:#172344}
main{max-width:560px;margin:auto;padding:20px;background:#fff;border-radius:18px;box-shadow:0 8px 24px #17234412}
h2{margin-top:0}
#reader{width:100%;overflow:hidden;border-radius:12px;min-height:180px}
#status{font-weight:bold;line-height:1.5;overflow-wrap:anywhere}
#hasil{font-size:22px;font-weight:bold;overflow-wrap:anywhere}
.info{font-size:13px;line-height:1.5;color:#555}
</style>
</head>
<body>
<main>
<h2>RPA QR SCANNER</h2>
<p>Arahkan kamera ke label QR barang. Hindari pantulan cahaya dan embun.</p>
<div id="reader"></div>
<p id="status" role="status" aria-live="polite">Menyiapkan kamera...</p>
<p id="hasil"></p>
<p class="info">Format QR: MJL-000014. Pastikan halaman ini dibuka dari RPA WMS agar kode dapat dikirim kembali secara otomatis.</p>
</main>
<script>
"use strict";
let scanner=null, terkunci=false, kameraBerjalan=false;
const statusEl=document.getElementById("status");
const hasilEl=document.getElementById("hasil");
function status(teks){statusEl.textContent=teks}

function kirimQR(teks){
  if(terkunci)return;
  const kode=String(teks||"").trim();
  if(!/^MJL-\d{6}$/.test(kode)){
    status("QR terbaca, tetapi format tidak sesuai. Format yang diterima: MJL-000014.");
    return;
  }
  terkunci=true;
  hasilEl.textContent="QR: "+kode;
  let terkirim=false;
  try{
    if(window.opener&&!window.opener.closed){
      window.opener.postMessage({type:"RPA_QR_SCANNED",value:kode},"*");
      terkirim=true;
    }
  }catch(e){console.error("Pengiriman QR gagal:",e)}
  status(terkirim?"QR "+kode+" berhasil dikirim ke RPA WMS.":"QR "+kode+" terbaca, tetapi RPA WMS tidak terhubung. Buka scanner dari RPA WMS.");
  hentikanKamera().finally(()=>{
    if(terkirim){
      setTimeout(()=>{
        try{window.close()}catch(e){console.warn(e)}
        setTimeout(()=>{
          if(!window.closed)status("QR sudah dikirim. Browser tidak mengizinkan halaman menutup otomatis; kembali ke RPA WMS.");
        },500);
      },300);
    }
  });
}

async function hentikanKamera(){
  if(!scanner)return;
  const lama=scanner; scanner=null; kameraBerjalan=false;
  try{if(lama.isScanning)await lama.stop()}catch(e){console.warn("Kamera:",e)}
  try{await lama.clear()}catch(e){console.warn("Pembersihan kamera:",e)}
}

async function mulaiOtomatis(){
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    status("Kamera memerlukan HTTPS. Buka scanner melalui alamat GitHub Pages.");
    return;
  }
  if(typeof window.Html5Qrcode==="undefined"||typeof window.Html5QrcodeSupportedFormats==="undefined"){
    status("Pustaka QR gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.");
    return;
  }

  status("Meminta izin kamera...");
  // Minta izin kamera terlebih dahulu agar perangkat dapat mengungkap daftar kameranya.
  let aliran=null;
  try{
    aliran=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    aliran.getTracks().forEach(track=>track.stop());
  }catch(e){
    console.error("Izin kamera:",e);
    if(e.name==="NotAllowedError"||e.name==="PermissionDeniedError"){
      status("Akses kamera ditolak. Izinkan kamera untuk situs GitHub Pages di pengaturan browser, lalu muat ulang halaman.");
    }else if(e.name==="NotFoundError"||e.name==="DevicesNotFoundError"){
      status("Kamera tidak ditemukan pada perangkat ini.");
    }else{
      status("Kamera tidak dapat diakses. Periksa izin browser dan pastikan kamera tidak digunakan aplikasi lain.");
    }
    return;
  }

  let kameraId=null;
  try{
    const kamera=await Html5Qrcode.getCameras();
    if(kamera&&kamera.length){
      const belakang=kamera.find(k=>/back|rear|environment|belakang|world/i.test(k.label||""));
      kameraId=(belakang||kamera[0]).id;
    }
  }catch(e){console.warn("Daftar kamera tidak tersedia; mencoba kamera belakang otomatis.",e)}

  scanner=new Html5Qrcode("reader",{
    formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],
    verbose:false
  });
  try{
    const opsi={fps:10,qrbox:(w,h)=>{
      const sisi=Math.max(100,Math.floor(Math.min(w,h)*0.75));
      return {width:Math.min(sisi,w),height:Math.min(sisi,h)};
    },disableFlip:false};

    if(kameraId){
      await scanner.start(kameraId,opsi,kirimQR,()=>{});
    }else{
      await scanner.start({facingMode:"environment"},opsi,kirimQR,()=>{});
    }
    kameraBerjalan=true;
    status("Kamera aktif. Arahkan QR ke kamera.");
  }catch(e){
    console.error("Gagal memulai scanner:",e);
    await hentikanKamera();
    if(e.name==="NotAllowedError"||e.name==="PermissionDeniedError"){
      status("Akses kamera ditolak. Izinkan kamera di pengaturan browser, lalu muat ulang halaman.");
    }else if(e.name==="NotReadableError"||e.name==="TrackStartError"){
      status("Kamera sedang digunakan aplikasi lain. Tutup aplikasi tersebut lalu muat ulang halaman.");
    }else{
      status("Kamera gagal dibuka: "+(e.message||"periksa izin kamera dan koneksi internet."));
    }
  }
}

window.addEventListener("pagehide",()=>{if(scanner)hentikanKamera()});
mulaiOtomatis();
</script>
</body>
</html>
