<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPA QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { color-scheme: dark; --navy:#101a36; --pink:#ff7eb6; --text:#f7f8ff; --muted:#c5cbe0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:22px 16px; background:linear-gradient(160deg,#101a36,#202b4d); color:var(--text); font:16px/1.45 Arial,sans-serif; }
    main { width:min(100%,480px); margin:0 auto; }
    .brand { text-align:center; margin:4px 0 18px; }
    h1 { font-size:24px; margin:0 0 8px; letter-spacing:1px; }
    .pink { color:var(--pink); }
    p { color:var(--muted); margin:0 0 16px; text-align:center; }
    #reader { width:100%; min-height:240px; overflow:hidden; border:2px solid var(--pink); border-radius:18px; background:#080d1d; }
    #status { margin:16px 0 0; padding:13px 14px; border-radius:12px; background:rgba(255,255,255,.08); text-align:center; overflow-wrap:anywhere; }
    #result { margin-top:12px; text-align:center; font-weight:700; font-size:22px; color:var(--pink); overflow-wrap:anywhere; }
    .hint { font-size:13px; margin-top:14px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <h1>RPA <span class="pink">QR SCANNER</span></h1>
      <p>Arahkan kamera ke label QR barang.</p>
    </div>
    <div id="reader"></div>
    <div id="status" role="status" aria-live="polite">Menyiapkan kamera otomatis…</div>
    <div id="result"></div>
    <p class="hint">Jika diminta, izinkan akses kamera pada browser.</p>
  </main>
<script>
(() => {
  'use strict';
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const qrRegionId = 'reader';
  const qrPattern = /MJL-\d{6}/i;
  let scanner = null;
  let locked = false;
  let starting = false;

  function status(message) { statusEl.textContent = message; }
  function isRearCamera(camera) {
    return /back|rear|environment|belakang|environmental/i.test(camera.label || '');
  }

  async function deliver(code) {
    if (locked) return;
    locked = true;
    resultEl.textContent = code;
    status('QR terbaca. Mengirim kode ke aplikasi RPA…');
    try {
      if (scanner && scanner.isScanning) await scanner.stop();
    } catch (e) { /* kamera bisa saja sudah berhenti */ }
    try { if (scanner) await scanner.clear(); } catch (e) { /* abaikan */ }

    if (window.opener && !window.opener.closed) {
      // INDEX.html memeriksa event.origin (asal pesan), bukan targetOrigin.
      // Wildcard diperlukan karena URL deployment Apps Script dapat berbeda antar deployment.
      window.opener.postMessage({ type: 'RPA_QR_SCANNED', value: code }, '*');
      status('QR ' + code + ' sudah dikirim ke RPA WMS. Periksa daftar barang di jendela RPA. Jendela ini tidak ditutup otomatis.');
    } else {
      status('QR terbaca: ' + code + ', tetapi jendela RPA tidak terhubung. Tutup halaman ini dan buka scanner dari tombol SCAN QR di RPA WMS.');
    }
  }

  async function onScanSuccess(decodedText) {
    const raw = String(decodedText || '').trim();
    const match = raw.match(qrPattern);
    if (!match) {
      status('QR terbaca, tetapi kode MJL-000000 tidak ditemukan. Isi QR: ' + raw.slice(0, 100));
      return;
    }
    const code = match[0].toUpperCase();
    await deliver(code);
  }

  async function startWithCamera(camera) {
    status('Membuka kamera otomatis…');
    scanner = new Html5Qrcode(qrRegionId, {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    });
    await scanner.start(
      { deviceId: { exact: camera.id } },
      {
        fps: 20,
        qrbox: (w, h) => {
          const side = Math.max(100, Math.floor(Math.min(w, h) * 0.85));
          return { width: Math.min(side, w, h), height: Math.min(side, w, h) };
        },
        aspectRatio: 1.0,
        disableFlip: false
      },
      onScanSuccess,
      () => {}
    );
    status('Kamera aktif. Arahkan ke QR barang.');
  }

  async function startCamera() {
    if (starting || locked) return;
    starting = true;
    try {
      if (typeof Html5Qrcode === 'undefined') throw new Error('Pustaka pemindai gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');
      if (!window.isSecureContext) throw new Error('Kamera perlu dibuka melalui HTTPS GitHub Pages.');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Browser ini tidak mendukung akses kamera. Buka dengan Chrome atau Edge terbaru.');
      // Minta izin kamera terlebih dahulu supaya browser menampilkan prompt izin jika diperlukan.
      const cameras = await Html5Qrcode.getCameras();
      if (!cameras || cameras.length === 0) throw new Error('Kamera tidak ditemukan. Izinkan akses kamera di pengaturan situs, lalu muat ulang.');
      const ordered = [...cameras.filter(isRearCamera), ...cameras.filter(c => !isRearCamera(c))];
      let lastError;
      for (const camera of ordered) {
        try {
          await startWithCamera(camera);
          return;
        } catch (err) {
          lastError = err;
          try { if (scanner) await scanner.clear(); } catch (e) {}
          scanner = null;
        }
      }
      throw lastError || new Error('Tidak berhasil membuka kamera.');
    } catch (err) {
      console.error('RPA QR Scanner:', err);
      const detail = err && err.message ? err.message : String(err || 'Kesalahan tidak diketahui');
      status('Kamera gagal dibuka: ' + detail + ' Pastikan izin kamera diizinkan, lalu muat ulang halaman.');
    } finally {
      starting = false;
    }
  }

  document.addEventListener('DOMContentLoaded', startCamera);
})();
</script>
</body>
</html>
