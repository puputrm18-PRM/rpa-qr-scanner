
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPA QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f5f2f8;
      color: #172344;
    }

    main {
      max-width: 560px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      background: #172344;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      font-weight: bold;
      line-height: 1.5;
    }

    #hasil {
      overflow-wrap: anywhere;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
<main>
  <h2>RPA QR SCANNER</h2>
  <p>Arahkan kamera ke QR label barang. Pastikan QR terlihat jelas dan tidak silau.</p>

  <button id="mulai" type="button" onclick="mulai()">BUKA KAMERA</button>
  <div id="reader"></div>
  <p id="status">Kamera belum dibuka.</p>
  <p id="hasil"></p>

  <button type="button" onclick="salin()">SALIN KODE QR</button>
  <button type="button" onclick="tutup()">TUTUP KAMERA</button>
</main>

<script>
let scanner = null;
let kodeQR = "";
let terkunci = false;
let sedangMulai = false;
let sedangTutup = false;

const statusEl = document.getElementById("status");
const hasilEl = document.getElementById("hasil");
const tombolMulai = document.getElementById("mulai");

async function mulai() {
  if (sedangMulai || scanner) return;

  if (!window.isSecureContext ||
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    statusEl.textContent =
      "Kamera perlu HTTPS. Buka halaman GitHub Pages.";
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    statusEl.textContent =
      "Library QR gagal dimuat. Periksa koneksi internet.";
    return;
  }

  sedangMulai = true;
  tombolMulai.disabled = true;

  try {
    terkunci = false;
    kodeQR = "";
    hasilEl.textContent = "";
    statusEl.textContent = "Membuka kamera...";

    scanner = new Html5Qrcode("reader", {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      verbose: false
    });

    // Resolusi luwih cetha, area scan luwih amba.
    await scanner.start(
      { facingMode: "user" },
      {
        fps: 20,
        qrbox: function(lebar, dhuwur) {
          const sisi = Math.floor(
            Math.min(lebar, dhuwur) * 0.85
          );
          return { width: sisi, height: sisi };
        },
        aspectRatio: 1,
        disableFlip: false,
        videoConstraints: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      },
      function(teks) {
        prosesQR(teks);
      },
      function() {
        // Ora perlu nampilake error saben frame.
      }
    );

    statusEl.textContent =
      "Kamera aktif. Cedhakake QR nganti katon cetha ing bingkai.";

  } catch (e) {
    console.error("Scanner error:", e);

    const jeneng = e && e.name ? e.name : "";

    if (jeneng === "NotAllowedError" ||
        jeneng === "PermissionDeniedError") {
      statusEl.textContent =
        "Izin kamera ditolak. Izinkan kamera ing browser.";
    } else if (jeneng === "NotFoundError" ||
               jeneng === "DevicesNotFoundError") {
      statusEl.textContent =
        "Kamera ora ditemokake. Priksa kamera laptop.";
    } else if (jeneng === "NotReadableError" ||
               jeneng === "TrackStartError") {
      statusEl.textContent =
        "Kamera lagi digunakake aplikasi liyane.";
    } else {
      statusEl.textContent =
        "Gagal mbukak kamera: " + (e.message || jeneng || "Kesalahan");
    }

    await tutupInternal();

  } finally {
    sedangMulai = false;
    tombolMulai.disabled = false;
  }
}

function prosesQR(teks) {
  if (terkunci) return;

  const hasil = String(teks).trim();

  // Format tetep MJL-000014: MJL + 6 digit.
  if (!/^MJL-\d{6}$/.test(hasil)) {
    statusEl.textContent =
      "QR ketemu, nanging format ora cocok. Gunakake label MJL-000014.";
    return;
  }

  terkunci = true;
  kodeQR = hasil;
  hasilEl.textContent = "QR terbaca: " + kodeQR;
  statusEl.textContent = "Ngirim QR menyang aplikasi RPA...";

  // Tetep nganggo mekanisme pesen sing wis digunakake aplikasi.
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage(
      {
        type: "RPA_QR_SCANNED",
        value: kodeQR
      },
      "https://puputrm18-prm.github.io"
    );

    statusEl.textContent =
      "QR " + kodeQR + " kasil dikirim menyang aplikasi RPA.";
  } else {
    statusEl.textContent =
      "QR terbaca, nanging jendela aplikasi RPA ora ditemokake.";
  }

  // Ora perlu ngenteni kamera rampung mandheg kanggo ngirim QR.
  tutupInternal();
}

async function tutupInternal() {
  if (sedangTutup) return;
  sedangTutup = true;

  const s = scanner;
  scanner = null;

  try {
    if (s && s.isScanning) {
      await s.stop();
    }
  } catch (e) {
    console.warn("Stop scanner:", e);
  }

  try {
    if (s) await s.clear();
  } catch (e) {
    console.warn("Clear scanner:", e);
  }

  sedangTutup = false;
}

async function tutup() {
  await tutupInternal();
  tombolMulai.disabled = false;
}

async function salin() {
  if (!kodeQR) {
    statusEl.textContent = "Durung ana QR sing kabaca.";
    return;
  }

  try {
    await navigator.clipboard.writeText(kodeQR);
    statusEl.textContent = "Kode QR kasil disalin.";
  } catch (e) {
    statusEl.textContent = "Kode QR: " + kodeQR;
  }
}
</script>
</body>
</html>
