
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPA QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f2f8;
      color: #172344;
    }
    main {
      max-width: 520px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 18px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 12px;
      background: #172344;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    #reader { width: 100%; }
    #hasil { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h2>RPA QR SCANNER</h2>
  <p>Arahkan kamera ke label QR barang.</p>

  <button id="mulai" type="button" onclick="mulai()">BUKA KAMERA</button>
  <div id="reader"></div>
  <p id="status">Kamera belum dibuka.</p>
  <p id="hasil"></p>
  <button type="button" onclick="salin()">SALIN KODE QR</button>
  <button type="button" onclick="tutup()">TUTUP KAMERA</button>
</main>

<script>
let scanner = null;
let kodeQR = "";
let terkunci = false;
let sedangMulai = false;

async function mulai() {
  const status = document.getElementById("status");
  const tombol = document.getElementById("mulai");

  if (sedangMulai) return;

  if (!window.isSecureContext ||
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    status.textContent =
      "Kamera tidak tersedia. Buka halaman GitHub Pages melalui HTTPS.";
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    status.textContent =
      "Library QR gagal dimuat. Periksa koneksi internet.";
    return;
  }

  sedangMulai = true;
  tombol.disabled = true;

  try {
    await tutup();
    terkunci = false;
    kodeQR = "";

    scanner = new Html5Qrcode("reader");
    status.textContent = "Meminta izin kamera...";

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      async function(teks) {
        if (terkunci) return;

        terkunci = true;
        kodeQR = String(teks).trim();

        document.getElementById("hasil").textContent =
          "QR terbaca: " + kodeQR;
        status.textContent = "Mengirim hasil QR ke aplikasi RPA...";

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(
            { type: "RPA_QR_SCANNED", value: kodeQR },
            "*"
          );
          status.textContent = "QR terbaca dan dikirim ke aplikasi RPA.";
        } else {
          status.textContent =
            "QR terbaca. Jendela aplikasi RPA tidak ditemukan.";
        }

        await tutup();
      },
      function() {}
    );

    status.textContent = "Arahkan kamera ke QR label.";
  } catch (e) {
    console.error("Scanner error:", e);

    let pesan = e && e.name ? e.name : "Kesalahan tidak diketahui";

    if (pesan === "NotAllowedError" || pesan === "PermissionDeniedError") {
      status.textContent =
        "Izin kamera ditolak. Izinkan kamera untuk situs GitHub Pages.";
    } else if (pesan === "NotFoundError" || pesan === "DevicesNotFoundError") {
      status.textContent = "Kamera tidak ditemukan pada perangkat ini.";
    } else if (pesan === "NotReadableError" || pesan === "TrackStartError") {
      status.textContent =
        "Kamera sedang digunakan aplikasi lain. Tutup aplikasi tersebut.";
    } else {
      status.textContent = "Gagal membuka kamera: " + pesan;
    }

    await tutup();
  } finally {
    sedangMulai = false;
    tombol.disabled = false;
  }
}

async function tutup() {
  const s = scanner;
  scanner = null;

  if (!s) return;

  try {
    if (s.isScanning) await s.stop();
  } catch (e) {
    console.warn("Stop scanner:", e);
  }

  try {
    await s.clear();
  } catch (e) {
    console.warn("Clear scanner:", e);
  }
}

async function salin() {
  const status = document.getElementById("status");

  if (!kodeQR) {
    status.textContent = "Belum ada QR yang terbaca.";
    return;
  }

  try {
    await navigator.clipboard.writeText(kodeQR);
    status.textContent = "Kode QR berhasil disalin.";
  } catch (e) {
    status.textContent = "Kode QR: " + kodeQR;
  }
}
</script>
</body>
</html>
